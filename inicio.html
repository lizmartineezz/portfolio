<script>
let desdeCarpeta = false;
let carpetaActual = null;

/* ===== FOTO CV ===== */
function abrirFoto() {

  const modal = document.getElementById("modal");
  const galeria = document.querySelector(".galeria-modal");

  // reset completo
  galeria.innerHTML = "";
  modal.style.display = "none";

  desdeCarpeta = false;
  carpetaActual = null;

  const img = document.createElement("img");
  img.src = "curriculum.png";
  img.className = "modal-img img-principal";

  galeria.appendChild(img);

  modal.style.display = "flex";
}

function cerrarFoto() {

  const modal = document.getElementById("modal");
  const galeria = document.querySelector(".galeria-modal");

  modal.style.display = "none";
  galeria.innerHTML = "";

  if (desdeCarpeta && carpetaActual) {
    document.getElementById(carpetaActual).style.display = "flex";
  }

  desdeCarpeta = false;
}


/* ===== CARPETAS ===== */

function abrirCarpeta1() {
  carpetaActual = "modalCarpeta1";
  document.getElementById("modalCarpeta1").style.display = "flex";
}

function abrirCarpeta2() {
  carpetaActual = "modalCarpeta2";
  document.getElementById("modalCarpeta2").style.display = "flex";
}

function abrirCarpeta3() {
  carpetaActual = "modalCarpeta3";
  document.getElementById("modalCarpeta3").style.display = "flex";
}

function abrirCarpeta4() {
  carpetaActual = "modalCarpeta4";
  document.getElementById("modalCarpeta4").style.display = "flex";
}

function abrirCarpeta5() {
  carpetaActual = "modalCarpeta5";
  document.getElementById("modalCarpeta5").style.display = "flex";
}

/* ===== CERRAR CUALQUIERA ===== */

function cerrarCarpeta() {
  if (carpetaActual) {
    document.getElementById(carpetaActual).style.display = "none";
    carpetaActual = null;
  }
}

/* ===== TRABAJOS ===== */

function abrirTrabajo(proyecto) {

  desdeCarpeta = true;

  if (carpetaActual) {
    document.getElementById(carpetaActual).style.display = "none";
  }

  const imagenes = {
    grappamiel: [
      "grappamiel.png",
      "explicacion8.png"
    ],

    jordan: [
      "jordan.png",
      "explicacion4.png"
    ],

   spotify: [
  "spotify.png",
  "explicacion2.png"
],

ruben_fontana: [
  "ruben-fontana.png",
  "explicacion1.png"
],

feria_del_libro: [
  "feria-del-libro.png",
  "explicacion5.png"
],
koaa: [
  "koa-logo.png",
  "explicacion10.png"
],
logo_torres: [
  "logo-torres.png",
  "explicacion3.png"
],
limon_logo: [
  "limon-logo-idea.png",
  "explicacion11.png"
],
coraza_logo: [
  "coraza-logo.png",
  "explicacion6.png"
],
calendario_ruben: [
  "calendario-ruben-fontana-mockup.jpg",
  "explicacion12.png"
],
mockup_libreta_ruben: [
  "mockup-libreta_-ruben-fontana-copia.jpg",
  "explicacion13.png"
],
packaging_koa_adulto: [
  "packaging-koa-adulto.jpg",
  "explicacion14.png"
],
packaging_koa_ninos: [
  "packaging-koa-niños.jpg",
  "explicacion15.png"
],
packaging_limonada: [
  "packaging-limonada.jpg",
  "explicacion16.png"
],
packaging_te: [
  "packaging-te.jpg",
  "explicacion17.png"
],
botella_etiqueta_hexagonal: [
  "botella-etiqueta-hexagonal.jpg",
  "explicacion18.png"
]
  };

  const galeria = document.querySelector(".galeria-modal");
  galeria.innerHTML = "";

  const lista = imagenes[proyecto] || [proyecto];

 lista.forEach((src, index) => {
  const img = document.createElement("img");
  img.src = src;

  if (index === 0) {
    img.classList.add("modal-img", "img-principal");
  } else {
    img.classList.add("img-secundaria");
  }

  galeria.appendChild(img);
});

  document.getElementById("modal").style.display = "flex";
}
</script>
